<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — CodeAlpha Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">Code<span>Alpha</span> Shop</a>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="cart.html" class="active">Cart</a>
                <a href="login.html" id="navLogin">Login</a>
                <a href="register.html" id="navRegister">Register</a>
                <button type="button" id="navLogout" class="nav-logout hidden">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <a href="index.html" class="back-link">&larr; Continue Shopping</a>

        <div class="page-header">
            <h1>Shopping Cart</h1>
            <p>Review your items before checkout</p>
        </div>

        <div id="cartItems" class="cart-list"></div>

        <div class="cart-summary" id="cartSummary">
            <h2>Order Summary</h2>
            <div class="total-amount" id="total"></div>
            <button id="checkoutBtn" class="btn-accent">Proceed to Checkout</button>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>&copy; 2026 CodeAlpha Shop</span>
            <span>Built with care</span>
        </div>
    </footer>

    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
