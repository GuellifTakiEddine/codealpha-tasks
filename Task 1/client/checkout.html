<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — CodeAlpha Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">Code<span>Alpha</span> Shop</a>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="cart.html">Cart</a>
                <a href="login.html" id="navLogin">Login</a>
                <a href="register.html" id="navRegister">Register</a>
                <button type="button" id="navLogout" class="nav-logout hidden">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <a href="cart.html" class="back-link">&larr; Back to Cart</a>

        <div class="page-header text-center">
            <h1>Checkout</h1>
            <p>Confirm your order and place it securely</p>
        </div>

        <div class="checkout-panel">
            <h2>Total Amount</h2>
            <div class="total-amount" id="total"></div>
            <button id="placeOrder">Place Order</button>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>&copy; 2026 CodeAlpha Shop</span>
            <span>Built with care</span>
        </div>
    </footer>

    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
