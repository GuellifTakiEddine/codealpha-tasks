<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — CodeAlpha Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">Code<span>Alpha</span> Shop</a>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="cart.html">Cart</a>
                <a href="login.html" id="navLogin">Login</a>
                <a href="register.html" id="navRegister" class="active">Register</a>
                <button type="button" id="navLogout" class="nav-logout hidden">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container page-content auth-page">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p class="subtitle">Join us and start shopping today</p>

            <form id="registerForm">
                <input type="text" id="name" placeholder="Full name" required>
                <input type="email" id="email" placeholder="Email address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Create Account</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>&copy; 2026 CodeAlpha Shop</span>
            <span>Built with care</span>
        </div>
    </footer>

    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
